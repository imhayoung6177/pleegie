name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ─── Java 빌드 ───
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Spring Boot JAR
        working-directory: ./backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test
          mv build/libs/*.jar ../app.jar

      # ─── React 빌드 ───
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          tar -czf ../frontend-dist.tar.gz -C dist .

      # ─── Python 소스 압축 ───
      - name: Pack Python source
        run: tar -czf python-src.tar.gz python_ai/

      # ─── EC2로 산출물 전송 ───
      - name: Copy artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar,frontend-dist.tar.gz,python-src.tar.gz"
          target: "/tmp/deploy/"

      # ─── EC2에서 배포 + 재시작 ───
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1) Spring Boot
            mv /tmp/deploy/app.jar /opt/pleegie/java/app.jar
            sudo systemctl restart pleegie-java

            # 2) React
            rm -rf /opt/pleegie/frontend/*
            tar -xzf /tmp/deploy/frontend-dist.tar.gz -C /opt/pleegie/frontend
            sudo chown -R ubuntu:www-data /opt/pleegie/frontend

            # 3) Python
            tar -xzf /tmp/deploy/python-src.tar.gz -C /tmp/deploy/
            rsync -a --delete /tmp/deploy/python_ai/ /opt/pleegie/python/ \
                  --exclude venv --exclude __pycache__ --exclude chroma_db
            cd /opt/pleegie/python
            source venv/bin/activate
            pip install -q -r requirements.txt
            deactivate
            sudo systemctl restart pleegie-python

            # 4) 정리
            rm -rf /tmp/deploy/*

            # 5) 헬스체크
            sleep 40
            curl -f http://127.0.0.1:8080/ || exit 1
            curl -f http://127.0.0.1:8000/ || exit 1